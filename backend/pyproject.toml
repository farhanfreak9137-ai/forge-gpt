[project]
name = "forgeagent-backend"
version = "1.0.0"
description = "ForgeAgent V1 Autonomous AI Software Development Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "playwright>=1.46.0",
    "python-multipart>=0.0.9",
    "websockets>=13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["app"]
markers = [
    "live: needs a logged-in Edge session and the real chatgpt.com (skipped unless FORGEAGENT_LIVE_TESTS=1)",
]

